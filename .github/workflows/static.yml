name: Deploy static content (feed) to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * 1,3,5' # 06:00 (UTC)
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Build feeds
        run: |
          uv run build.py amapi atom > amapi-rel-notes.atom
          uv run build.py amapi rss > amapi-rel-notes.rss
          uv run build.py sdk atom > amapi-sdk.atom
          uv run build.py sdk rss > amapi-sdk.rss
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
